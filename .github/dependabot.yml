version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      - dependency-name: 'vue'
        update-types:
          - version-update:semver-major
      - dependency-name: 'vue-i18n'
        update-types:
          - version-update:semver-major
      - dependency-name: 'bootstrap'
        update-types:
          - version-update:semver-major
      - dependency-name: '@popperjs/core'
        update-types:
          - version-update:semver-major
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      npm-major:
        patterns:
          - '*'
        update-types:
          - major
        group-by: dependency-name
